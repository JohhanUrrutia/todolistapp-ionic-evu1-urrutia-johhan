<ion-header>
  <ion-toolbar>
    <ion-title>Lista de tareas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-button expand="block" routerLink="/agregar-tarea">Agregar tarea</ion-button>

  <ion-list>
    @for (tarea of tareasService.tareas; track $index) {
      <ion-item>
        <ion-label>
          <h2>{{ tarea.titulo }}</h2>
          <p>{{ tarea.descripcion }}</p>
        </ion-label>
        <ion-button slot="end" [routerLink]="['/editar-tarea', $index]">Editar</ion-button>
        <ion-button slot="end" color="danger" (click)="tareasService.eliminar($index)">Eliminar</ion-button>
      </ion-item>
    }
  </ion-list>
</ion-content>
